name: integration tests

on:
  workflow_dispatch:
    inputs:
      trigger_btp:
        description: 'Trigger BTP integration test'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      trigger_btp:
        description: 'Trigger BTP integration test'
        required: false
        type: boolean
        default: false
      image:
        description: "The image to test"
        required: true
        type: string

jobs:
  integration-test:
    environment: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: kyma-project/manager-toolkit/.github/actions/setup-go@main
      - uses: kyma-project/manager-toolkit/.github/actions/create-k3d-cluster@main
      - name: run test
        run: make -C hack/ci integration-test-on-cluster
        env:
          IMG: ${{ inputs.image }}

  btp-integration-tests:
    if: ${{ inputs.trigger_btp }}
    environment: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compute github commit sha
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: kyma-project/terraform-module/.github/actions/create-sap-btp-kyma@1.0.0
        id: create-btp-resources
        with:
          btp_subaccount_name: keda-test-${{ steps.vars.outputs.sha_short }}-${{ github.run_attempt }}
          btp_backend_url: "${{ vars.BTP_BACKEND_URL}}"
          btp_user: "${{ vars.BTP_BOT_USER}}"
          btp_password: "${{ secrets.BTP_BOT_PASSWORD}}"
          btp_global_account: "${{ vars.BTP_GLOBAL_ACCOUNT }}"
          btp_idp_tenant: "${{ vars.BTP_CUSTOM_IAS_TENANT }}"
          btp_subaccount_region: "${{ vars.BTP_SUBACCOUNT_REGION }}"
          btp_kyma_region: "${{ vars.BTP_KYMA_REGION }}"
          btp_kyma_plan: "${{ vars.BTP_KYMA_PLAN }}"

      - name: Run Keda Manager's integration test
        run: |
          KUBECONFIG=${KUBECONFIG} make -C hack/ci integration-test-on-cluster
        env:
          IMG: ${{ inputs.image }}

      - uses: kyma-project/terraform-module/.github/actions/force-delete-sap-btp-subaccount@1.0.0
        if: always()
        with:
          btp_subaccount_id: ${{ steps.create-btp-resources.outputs.subaccount_id }}
          btp_backend_url: ${{ vars.BTP_BACKEND_URL}}
          btp_user: ${{ vars.BTP_BOT_USER}}
          btp_password: ${{ secrets.BTP_BOT_PASSWORD}}
          btp_global_account: ${{ vars.BTP_GLOBAL_ACCOUNT }}
          btp_idp_tenant: ${{ vars.BTP_CUSTOM_IAS_TENANT }}

  btp-scale-to-zero-integration-tests:
    if: ${{ inputs.trigger_btp }}
    environment: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compute github commit sha
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: kyma-project/terraform-module/.github/actions/create-sap-btp-kyma@1.0.0
        id: create-btp-resources
        with:
          btp_subaccount_name: keda-test-${{ steps.vars.outputs.sha_short }}-${{ github.run_attempt }}
          btp_backend_url: "${{ vars.BTP_BACKEND_URL}}"
          btp_user: "${{ vars.BTP_BOT_USER}}"
          btp_password: "${{ secrets.BTP_BOT_PASSWORD}}"
          btp_global_account: "${{ vars.BTP_GLOBAL_ACCOUNT }}"
          btp_idp_tenant: "${{ vars.BTP_CUSTOM_IAS_TENANT }}"
          btp_subaccount_region: "${{ vars.BTP_SUBACCOUNT_REGION }}"
          btp_kyma_region: "${{ vars.BTP_KYMA_REGION }}"
          btp_kyma_plan: "${{ vars.BTP_KYMA_PLAN }}"
      - name: Run Keda Addon BTP integration test
        run: |
          kubectl create namespace kyma-system || true
          make deploy
          make -C hack/ci http-addon-scale-to-zero
        env:
          IMG: ${{ inputs.image }}
      - uses: kyma-project/terraform-module/.github/actions/force-delete-sap-btp-subaccount@1.0.0
        if: always()
        with:
          btp_subaccount_id: ${{ steps.create-btp-resources.outputs.subaccount_id }}
          btp_backend_url: ${{ vars.BTP_BACKEND_URL}}
          btp_user: ${{ vars.BTP_BOT_USER}}
          btp_password: ${{ secrets.BTP_BOT_PASSWORD}}
          btp_global_account: ${{ vars.BTP_GLOBAL_ACCOUNT }}
          btp_idp_tenant: ${{ vars.BTP_CUSTOM_IAS_TENANT }}

  rbac-integration-test:
    environment: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: kyma-project/manager-toolkit/.github/actions/setup-go@main
      - uses: kyma-project/manager-toolkit/.github/actions/create-k3d-cluster@main
      - name: deploy keda
        run: |
          kubectl create namespace kyma-system || true
          make deploy
        env:
          IMG: ${{ inputs.image }}
      - name: run rbac tests
        uses: kyma-project/manager-toolkit/.github/actions/test-rbac-propagation@main
        with:
          config: ${{ github.workspace }}/test/rbac/config.yaml

  http-add-on-integration-test:
    environment: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: kyma-project/manager-toolkit/.github/actions/setup-go@main
      - uses: kyma-project/manager-toolkit/.github/actions/create-k3d-cluster@main
      - name: deploy keda
        run: |
          kubectl create namespace kyma-system || true
          make deploy
        env:
          IMG: ${{ inputs.image }}
      - name: run http add-on integration test
        run: make -C hack/ci http-addon-integration-test
